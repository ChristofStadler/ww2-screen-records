name: Update IMDb ratings and posters

# Fills real IMDb ratings and poster plates into index.html. Runs on the first
# push, on demand, and monthly so the figures don't go stale.
#
# Posters need the TMDB_API_KEY repository secret (IMDb's datasets carry no
# images). Without it the ratings pass still runs and posters are left alone.
#
# The commit this makes uses GITHUB_TOKEN, and pushes made with that token do
# not trigger workflows — so this cannot loop.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of each month

permissions:
  contents: write

concurrency:
  group: imdb-ratings
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ratings and posters, rewrite index.html
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 update_ratings.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html
          if [ -d posters ]; then git add -A posters; fi
          if git diff --cached --quiet; then
            echo "Nothing changed — nothing to commit."
            exit 0
          fi
          git commit -m "Refresh IMDb ratings and poster plates"
          git push
